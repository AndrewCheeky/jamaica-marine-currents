name: Generate Jamaica currents map
on:
  # Started by the marine Apps Script refresh chain (RefreshChain.gs) at about 1:45 AM, 7:45 AM, 1:45 PM and 7:45 PM
  # Jamaica time, with backups. GitHub's own timer is off because it ran hours late; use "Run workflow" to start by hand.
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore persistent history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python history_storage.py restore
      - name: Generate current map
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          COPERNICUS_DATASET_ID: cmems_mod_glo_phy-cur_anfc_0.083deg_PT6H-i
        run: python generate.py
      - name: Save and verify persistent history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python history_storage.py save
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait 60 s so GitHub has registered the upload
        # GitHub can take a while to list a just-uploaded site; publishing too soon fails with "Found 0 artifacts".
        run: sleep 60
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait 60 s before retrying the publish
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
