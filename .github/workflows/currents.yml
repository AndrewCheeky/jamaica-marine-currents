name: Generate Jamaica currents map
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5,11,17,23 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore persistent history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python history_storage.py restore
      - name: Generate current map
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          COPERNICUS_DATASET_ID: cmems_mod_glo_phy-cur_anfc_0.083deg_PT6H-i
        run: python generate.py
      - name: Save and verify persistent history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python history_storage.py save
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
