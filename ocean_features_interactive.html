<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Ocean Features</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoTQXc9+8eGk=" crossorigin=""><style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui,sans-serif}#error{position:absolute;z-index:999;top:10px;left:10px;right:10px;background:#fff8e8;padding:10px;border-radius:8px;display:none}button.copy{cursor:pointer;padding:5px 9px;border:1px solid #999;border-radius:6px;background:#fff} .leaflet-popup-content{line-height:1.5;min-width:205px} .leaflet-container{background:#103a4e}#feature-panel{position:absolute;bottom:10px;left:10px;z-index:1200;max-height:31%;overflow:auto;width:min(360px,calc(100% - 20px));background:#052638ed;color:#fff;border:1px solid #5dd4ec;border-radius:12px;padding:10px;box-shadow:0 10px 28px #0006}#feature-panel h2{font-size:13px;margin:0 0 8px;color:#ffd846}#feature-buttons{display:block}#feature-panel{max-height:38%}#feature-panel summary{cursor:pointer;color:#ffd846;font-weight:750;padding:4px 0}#feature-panel details{border-top:1px solid #346173;padding:5px 0}#feature-panel details:first-child{border:0}#feature-panel .feature-entry{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border-radius:8px;margin:4px 0;padding:7px;background:#123f55;color:white;border:1px solid #447587;cursor:pointer}#feature-panel .feature-entry[aria-pressed="true"]{border-color:#ffd846;background:#23596d}#feature-panel .feature-num{flex:none;display:inline-flex;align-items:center;justify-content:center;min-width:31px;height:31px;border-radius:50%;border:2px solid white;color:#052638;font-weight:800}#feature-panel .feature-entry span:last-child{flex:1;overflow-wrap:anywhere}.numbered-map-pin{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:2px solid #fff;border-radius:50%;font:800 13px system-ui;color:#052638;box-shadow:0 1px 6px #001e2acc;cursor:pointer}.numbered-map-pin.active{outline:4px solid #ffd846;outline-offset:2px}.leaflet-marker-icon{pointer-events:auto!important;cursor:pointer!important}#feature-buttons button{font:12px system-ui;padding:7px 9px;border-radius:18px;border:1px solid #5dd4ec;background:#123f55;color:white;cursor:pointer}#feature-buttons button:hover,#feature-buttons button:focus-visible{background:#ffd846;color:#052638}#detail-modal{position:absolute;inset:0;z-index:1800;background:#001725aa;display:none;align-items:center;justify-content:center;padding:16px}#detail-card{background:white;color:#123145;border-radius:16px;padding:22px;max-width:420px;width:100%;max-height:85%;overflow:auto;box-shadow:0 18px 45px #0008}#detail-close{float:right;border:0;background:#052638;color:white;border-radius:30px;padding:7px 12px;cursor:pointer}#detail-card strong{display:block;margin:4px 0 10px;font-size:18px}#detail-card div{margin:5px 0}#detail-card button.copy{margin-top:12px;background:#ffd846;border-color:#ffd846}#sea-number-overlay{position:absolute;inset:0;width:100%;height:100%;z-index:1100;pointer-events:none;overflow:visible}#sea-number-overlay .sea-number-target{pointer-events:all;cursor:pointer}#sea-number-overlay .sea-number-target:focus{outline:none;stroke:#ffd846;stroke-width:5}#error{z-index:1900}@media(max-width:550px){#feature-panel{max-height:24%}}</style></head><body><div id="map" role="application" aria-label="Interactive ocean front features"></div><div id="error" role="alert"></div><section id="feature-panel" aria-label="Select an ocean feature"><h2>SELECT A NUMBERED SEA FEATURE</h2><div id="feature-buttons"></div></section><div id="detail-modal" role="dialog" aria-modal="true" aria-label="Ocean feature details"><div id="detail-card"><button id="detail-close" type="button" aria-label="Close details">Close ×</button><div id="detail-content"></div></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(()=>{'use strict';const error=document.querySelector('#error');function fail(message){error.style.display='block';error.textContent=message;}if(!window.L){fail('Interactive mapping library unavailable. Please retry the map later.');return;}
// Stationary inspection map: zoom via +/- only, no accidental pointer-driven panning.
const map=L.map('map',{zoomControl:true,preferCanvas:false,worldCopyJump:false,zoomSnap:.25,dragging:false,scrollWheelZoom:false,touchZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false});
// v3.9.4: Coastline geometry is specified in real WGS84 lat/lon and projected by Leaflet
// exactly like the model-derived GeoJSON. No image-overlay pixel/projection mismatch.
const coastlines=[[[18.40085,-76.8966],[18.1607,-76.36535],[17.88685,-76.19965],[17.86825,-76.90255],[17.7011,-77.20635],[17.8616,-77.766],[18.22595,-78.3377],[18.45455,-78.21775],[18.5242,-77.79735],[18.49055,-77.5696],[18.40085,-76.8966]],[[19.92345,-74.9616],[19.87375,-75.6347],[19.9529,-76.32365],[19.8555,-77.7555],[20.0,-77.5818],[20.0,-74.56055],[19.92345,-74.9616]]];
for(const points of coastlines){L.polygon(points,{color:'#dfe8d8',weight:1.5,fillColor:'#bdc8bf',fillOpacity:1,interactive:false}).addTo(map);}
for(let lon=-79;lon<=-75;lon++){L.polyline([[16,lon],[20,lon]],{color:'#386378',weight:.7,opacity:.45,interactive:false}).addTo(map);}
for(let lat=16;lat<=20;lat++){L.polyline([[lat,-79.5],[lat,-74.5]],{color:'#386378',weight:.7,opacity:.45,interactive:false}).addTo(map);}
map.fitBounds([[17.05,-79.1],[19.1,-75.7]],{padding:[18,18]});
map.setMaxBounds([[15.5,-80],[20.5,-74]]);map.setMinZoom(6);

const colors={sst_front:'#f6b64e',convergence:'#20aabb',shear:'#d75dc4',eddy_candidate:'#9c7eea'};let data=null,filter='all',bank='';let group=L.layerGroup().addTo(map);const featureButtons=document.querySelector('#feature-buttons'),detailModal=document.querySelector('#detail-modal'),detailContent=document.querySelector('#detail-content');function showFeature(f){detailContent.replaceChildren(popup(f));detailModal.style.display='flex';}document.querySelector('#detail-close').addEventListener('click',()=>detailModal.style.display='none');detailModal.addEventListener('click',e=>{if(e.target===detailModal)detailModal.style.display='none';});document.addEventListener('keydown',e=>{if(e.key==='Escape')detailModal.style.display='none';});const selectedKinds=()=>filter==='all'?null:filter==='currents'?['convergence','shear']:[filter];const permitted=f=>{const k=f.properties?.kind;const kinds=selectedKinds();return(!kinds||kinds.includes(k))&&(f.geometry?.type!=='Point'||!bank||f.properties.bank===bank);};
function textRow(el,title,value){if(value===null||value===undefined||value===''||(typeof value==='number'&&!Number.isFinite(value))||/^(unavailable|unknown|n\/a|null|undefined|nan)(\s|$)/i.test(String(value)))return;const row=document.createElement('div');const b=document.createElement('strong');b.textContent=title+': ';row.append(b,document.createTextNode(String(value)));el.append(row);}
function dd(n,pos,neg){return Math.abs(n).toFixed(4)+'° '+(n>=0?pos:neg);}function ddm(n,pos,neg){const abs=Math.abs(n),deg=Math.floor(abs),minutes=((abs-deg)*60).toFixed(3);return deg+'° '+minutes+'′ '+(n>=0?pos:neg);}
function popup(f){const p=f.properties||{},el=document.createElement('div');const title=document.createElement('strong');title.textContent=p.label||'Ocean feature';el.append(title);const explanations={sst_front:'A boundary between warmer and cooler surface water; fish may gather near these changes, but catches are not guaranteed.',convergence:'An area where surface currents come together, potentially concentrating floating material and food.',shear:'A zone where nearby currents move at different speeds or directions, creating mixing and changing water conditions.',eddy_candidate:'A possible circular movement of water identified by the model; its position and strength are uncertain.'};const meaning=explanations[p.kind];if(meaning){const expl=document.createElement('p');expl.className='feature-explanation';expl.textContent=meaning;expl.style.cssText='margin:8px 0 12px;line-height:1.5;color:#111827;font-weight:500';el.append(expl);}const point=f.geometry.type==='Point';if(point){const [lon,lat]=f.geometry.coordinates;textRow(el,'GPS (DD)',dd(lat,'N','S')+', '+dd(lon,'E','W'));textRow(el,'Marine GPS',ddm(lat,'N','S')+', '+ddm(lon,'E','W'));textRow(el,'Search radius',(Number.isFinite(Number(p.search_radius_km))&&p.search_radius_km!==null&&p.search_radius_km!==''?p.search_radius_km+' km (approx.)':null));textRow(el,'Relative strength',(p.strength===undefined||p.strength===null||p.strength===''?null:p.strength+' '+(p.unit||'')));textRow(el,'Persistence',p.persistence);textRow(el,'Previous matching dates',p.historical_matching_dates);const btn=document.createElement('button');btn.className='copy';btn.type='button';btn.textContent='Copy GPS';btn.addEventListener('click',()=>{const value=lat.toFixed(5)+', '+lon.toFixed(5);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(value).then(()=>btn.textContent='Copied').catch(()=>btn.textContent='Copy unavailable');}else btn.textContent='Copy unavailable';});el.append(btn);}else{textRow(el,'Boundary','Model-derived line; click any part to inspect');textRow(el,'Detection threshold',(p.strength_threshold===undefined||p.strength_threshold===null?null:p.strength_threshold+' '+(p.unit||'')));}const note=document.createElement('p');note.textContent='Experimental environmental feature; not a confirmed fishing location or navigational waypoint.';el.append(note);return el;}
const labels={sst_front:'Temperature fronts',convergence:'Current convergence',shear:'Current shear',eddy_candidate:'Possible eddies / rotation'};
const featureIndex=new Map();let activeFeature=null;
// SVG numbers are positioned in container pixels and always drawn ABOVE Leaflet paths and markers.
// The overlay is a direct child of the map container and is redrawn on zoom/resize.
const NS='http://www.w3.org/2000/svg';
const numberOverlay=document.createElementNS(NS,'svg');numberOverlay.id='sea-number-overlay';numberOverlay.setAttribute('aria-label','Numbered sea features');map.getContainer().appendChild(numberOverlay);
const numberNodes=new Map();
function positionNumbers(){const bounds=map.getSize();numberOverlay.setAttribute('viewBox',`0 0 ${bounds.x} ${bounds.y}`);for(const [id,record] of featureIndex){const point=map.latLngToContainerPoint(record.latlng);record.numberNode.setAttribute('transform',`translate(${point.x} ${point.y})`);}}
function makeNumber(id,color,latlng){const g=document.createElementNS(NS,'g');g.classList.add('sea-number-target');g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',`Feature ${id}`);const c=document.createElementNS(NS,'circle');c.setAttribute('r','17');c.setAttribute('fill',color);c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','2.5');const t=document.createElementNS(NS,'text');t.textContent=id;t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('fill','#092638');t.setAttribute('font-size','13');t.setAttribute('font-weight','800');t.setAttribute('pointer-events','none');g.append(c,t);g.addEventListener('click',e=>{e.stopPropagation();chooseFeature(id);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseFeature(id);}});numberOverlay.appendChild(g);return g;}
map.on('zoomend resize moveend',positionNumbers);

function featureId(f,i){return String(i+1).padStart(2,'0');}
function midpoint(f){const coords=f.geometry?.coordinates;if(!Array.isArray(coords)||!coords.length)return null;if(f.geometry.type==='Point')return [coords[1],coords[0]];if(f.geometry.type==='LineString'){const c=coords[Math.floor((coords.length-1)/2)];return [c[1],c[0]];}return null;}
function chooseFeature(id){const record=featureIndex.get(id);if(!record)return;activeFeature=id;for(const [key,item] of featureIndex){item.button.setAttribute('aria-pressed',String(key===id));const c=item.numberNode.querySelector('circle');if(c){c.setAttribute('stroke',key===id?'#ffd846':'#fff');c.setAttribute('stroke-width',key===id?'5':'2.5');}}record.button.scrollIntoView({block:'nearest',behavior:'smooth'});showFeature(record.feature);}
function draw(){group.clearLayers();numberOverlay.replaceChildren();featureButtons.replaceChildren();featureIndex.clear();if(!data)return;let count=0;const groups=new Map();const all=data.features||[];
for(let i=0;i<all.length;i++){const f=all[i];if(!permitted(f))continue;const kind=f.properties?.kind,color=colors[kind]||'#fff';const latlng=midpoint(f);if(!latlng||!latlng.every(Number.isFinite))continue;const id=featureId(f,i);const label=f.properties?.label||labels[kind]||'Ocean feature';let shape=null;
if(f.geometry.type==='Point'){shape=L.circleMarker(latlng,{radius:11,color:'#fff',weight:2,fillColor:color,fillOpacity:.9,interactive:true,bubblingMouseEvents:false}).addTo(group);}
else if(f.geometry.type==='LineString'){const points=f.geometry.coordinates.map(c=>[c[1],c[0]]);shape=L.polyline(points,{color,weight:5,opacity:.95,interactive:true,bubblingMouseEvents:false}).addTo(group);const hit=L.polyline(points,{color,weight:25,opacity:0.02,interactive:true,bubblingMouseEvents:false}).addTo(group);hit.on('click',()=>chooseFeature(id));}else continue;
shape.on('click',()=>chooseFeature(id));
// A dedicated top-level SVG overlay keeps each number visible above every map path.
const numberNode=makeNumber(id,color,latlng);
if(!groups.has(kind))groups.set(kind,[]);
const button=document.createElement('button');button.type='button';button.className='feature-entry';button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','Feature '+id+': '+label);const number=document.createElement('span');number.className='feature-num';number.style.background=color;number.textContent=id;const name=document.createElement('span');name.textContent=label;button.append(number,name);button.addEventListener('click',()=>chooseFeature(id));groups.get(kind).push(button);featureIndex.set(id,{feature:f,latlng,numberNode,button});count++;}
for(const [kind,buttons] of groups){const section=document.createElement('details');section.open=true;const summary=document.createElement('summary');summary.textContent=(labels[kind]||'Other features')+' ('+buttons.length+')';section.append(summary,...buttons);featureButtons.append(section);}
if(!count)fail('No detected features match this selection at the available model resolution.');else error.style.display='none';
positionNumbers();
if(activeFeature&&featureIndex.has(activeFeature)){const selected=featureIndex.get(activeFeature);selected.button.setAttribute('aria-pressed','true');}else activeFeature=null;
}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.source!=='jfi-feature-controls')return;filter=event.data.filter||'all';bank=event.data.bank||'';draw();});fetch('ocean-features.geojson',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Feature file unavailable');return r.json()}).then(j=>{if(j.type!=='FeatureCollection'||!Array.isArray(j.features))throw Error('Invalid feature data');data=j;draw();}).catch(e=>fail('Interactive feature data unavailable: '+e.message));
})();</script></body></html>
