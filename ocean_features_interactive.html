<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Ocean Features</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoTQXc9+8eGk=" crossorigin=""><style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui,sans-serif}#error{position:absolute;z-index:999;top:10px;left:10px;right:10px;background:#fff8e8;padding:10px;border-radius:8px;display:none}button.copy{cursor:pointer;padding:5px 9px;border:1px solid #999;border-radius:6px;background:#fff} .leaflet-popup-content{line-height:1.5;min-width:205px} .leaflet-container{background:#103a4e}</style></head><body><div id="map" role="application" aria-label="Interactive ocean front features"></div><div id="error" role="alert"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
(()=>{'use strict';const error=document.querySelector('#error');function fail(message){error.style.display='block';error.textContent=message;}if(!window.L){fail('Interactive mapping library unavailable. Please retry the map later.');return;}
// Stationary inspection map: zoom via +/- only, no accidental pointer-driven panning.
const map=L.map('map',{zoomControl:true,preferCanvas:false,worldCopyJump:false,zoomSnap:.25,dragging:false,scrollWheelZoom:false,touchZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false});
// v3.9.4: Coastline geometry is specified in real WGS84 lat/lon and projected by Leaflet
// exactly like the model-derived GeoJSON. No image-overlay pixel/projection mismatch.
const coastlines=[[[18.40085,-76.8966],[18.1607,-76.36535],[17.88685,-76.19965],[17.86825,-76.90255],[17.7011,-77.20635],[17.8616,-77.766],[18.22595,-78.3377],[18.45455,-78.21775],[18.5242,-77.79735],[18.49055,-77.5696],[18.40085,-76.8966]],[[19.92345,-74.9616],[19.87375,-75.6347],[19.9529,-76.32365],[19.8555,-77.7555],[20.0,-77.5818],[20.0,-74.56055],[19.92345,-74.9616]]];
for(const points of coastlines){L.polygon(points,{color:'#dfe8d8',weight:1.5,fillColor:'#bdc8bf',fillOpacity:1,interactive:false}).addTo(map);}
for(let lon=-79;lon<=-75;lon++){L.polyline([[16,lon],[20,lon]],{color:'#386378',weight:.7,opacity:.45,interactive:false}).addTo(map);}
for(let lat=16;lat<=20;lat++){L.polyline([[lat,-79.5],[lat,-74.5]],{color:'#386378',weight:.7,opacity:.45,interactive:false}).addTo(map);}
map.fitBounds([[17.05,-79.1],[19.1,-75.7]],{padding:[18,18]});
map.setMaxBounds([[15.5,-80],[20.5,-74]]);map.setMinZoom(6);

const colors={sst_front:'#f6b64e',convergence:'#20aabb',shear:'#d75dc4',eddy_candidate:'#9c7eea'};let data=null,filter='all',bank='';let group=L.layerGroup().addTo(map);const selectedKinds=()=>filter==='all'?null:filter==='currents'?['convergence','shear']:[filter];const permitted=f=>{const k=f.properties?.kind;const kinds=selectedKinds();return(!kinds||kinds.includes(k))&&(f.geometry?.type!=='Point'||!bank||f.properties.bank===bank);};
function textRow(el,title,value){const row=document.createElement('div');const b=document.createElement('strong');b.textContent=title+': ';row.append(b,document.createTextNode(String(value??'Unavailable')));el.append(row);}
function dd(n,pos,neg){return Math.abs(n).toFixed(4)+'° '+(n>=0?pos:neg);}function ddm(n,pos,neg){const abs=Math.abs(n),deg=Math.floor(abs),minutes=((abs-deg)*60).toFixed(3);return deg+'° '+minutes+'′ '+(n>=0?pos:neg);}
function popup(f){const p=f.properties||{},el=document.createElement('div');const title=document.createElement('strong');title.textContent=p.label||'Ocean feature';el.append(title);const point=f.geometry.type==='Point';if(point){const [lon,lat]=f.geometry.coordinates;textRow(el,'GPS (DD)',dd(lat,'N','S')+', '+dd(lon,'E','W'));textRow(el,'Marine GPS',ddm(lat,'N','S')+', '+ddm(lon,'E','W'));textRow(el,'Search radius',p.search_radius_km+' km (approx.)');textRow(el,'Relative strength',p.strength+' '+(p.unit||''));textRow(el,'Persistence',p.persistence||'Not established');textRow(el,'Previous matching dates',p.historical_matching_dates??0);const btn=document.createElement('button');btn.className='copy';btn.type='button';btn.textContent='Copy GPS';btn.addEventListener('click',()=>{const value=lat.toFixed(5)+', '+lon.toFixed(5);if(navigator.clipboard?.writeText){navigator.clipboard.writeText(value).then(()=>btn.textContent='Copied').catch(()=>btn.textContent='Copy unavailable');}else btn.textContent='Copy unavailable';});el.append(btn);}else{textRow(el,'Boundary','Model-derived line; click any part to inspect');textRow(el,'Detection threshold',p.strength_threshold+' '+(p.unit||''));}textRow(el,'SST valid',p.sst_valid_utc||data?.properties?.sst_valid_utc);textRow(el,'Current valid',p.currents_valid_utc||data?.properties?.currents_valid_utc);const note=document.createElement('p');note.textContent='Experimental environmental feature; not a confirmed fishing location or navigational waypoint.';el.append(note);return el;}
function draw(){group.clearLayers();if(!data)return;let count=0;for(const f of data.features||[]){if(!permitted(f))continue;const kind=f.properties?.kind,color=colors[kind]||'#fff';let shape;if(f.geometry.type==='Point'){const [lon,lat]=f.geometry.coordinates;shape=L.circleMarker([lat,lon],{radius:11,color:'#fff',weight:2,fillColor:color,fillOpacity:.95,interactive:true,bubblingMouseEvents:false});}else if(f.geometry.type==='LineString'){shape=L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]),{color,weight:5,opacity:.95,interactive:true,bubblingMouseEvents:false});}else continue;shape.bindPopup(()=>popup(f),{maxWidth:320,autoPan:false});shape.addTo(group);if(f.geometry.type==='LineString'){const hit=L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]),{color,weight:24,opacity:0.01,interactive:true,bubblingMouseEvents:false});hit.bindPopup(()=>popup(f),{maxWidth:320,autoPan:false});hit.addTo(group);}count++;}if(!count)fail('No detected features match this selection at the available model resolution.');else error.style.display='none';}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.data?.source!=='jfi-feature-controls')return;filter=event.data.filter||'all';bank=event.data.bank||'';draw();});fetch('ocean-features.geojson',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Feature file unavailable');return r.json()}).then(j=>{if(j.type!=='FeatureCollection'||!Array.isArray(j.features))throw Error('Invalid feature data');data=j;draw();}).catch(e=>fail('Interactive feature data unavailable: '+e.message));
})();</script></body></html>
